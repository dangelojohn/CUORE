<title>CUORE Bay Tablet</title>
<style>
/* Committed dark: this is the bay tablet, where a white screen is a flashlight.
   Tokens are CUORE's own (cuore/web/static/cuore.css) so the mockup and the app
   cannot drift. Every colour is painted explicitly, so the page holds on any
   host ground. No webfont: the drive node runs offline and a CDN face would
   fall back silently in the car. */
:root{
  --bg:#101315; --surface:#171b1e; --surface-2:#1e2429; --raised:#262d33;
  --rule:#2b3338; --rule-soft:#222a2f;
  --ink:#e3e7ea; --ink-2:#aeb8bf; --ink-3:#79848c;
  --accent:#e8565c; --accent-bg:#33191b;
  --chronic:#d9a63c; --chronic-bg:#2e2513;
  --cleared:#6aa6d8; --cleared-bg:#16242e;
  --once:#7d888f;   --once-bg:#21282c;
  --ok:#5fb3ac;     --ok-bg:#122a29;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tap:44px;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.phone{max-width:820px;margin:0 auto;min-height:100vh;background:var(--bg)}

/* ---------- nav bar: back-title breadcrumb, Apple's orienting device ---------- */
.nav{
  position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--rule);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:8px;padding:0 6px;min-height:var(--tap);
}
.back{
  display:inline-flex;align-items:center;gap:3px;min-height:var(--tap);
  padding:0 8px;background:none;border:0;color:var(--accent);
  font:inherit;font-size:14.5px;cursor:pointer;justify-self:start;
  max-width:190px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.back[hidden]{display:none}
.back .chev{font-size:19px;line-height:1;margin-top:-2px}
.nav h1{
  grid-column:2;margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:44vw;
}
.nav .vin{
  grid-column:3;justify-self:end;padding-right:8px;
  font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;
}

/* ---------- vehicle strip: never scrolls out of reach ---------- */
.vstrip{
  background:var(--surface-2);border-bottom:1px solid var(--rule);
  padding:7px 16px;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.vstrip b{color:var(--ink-2);font-weight:500}

main{padding:14px 0 56px}

/* ---------- the call: the one thing worth reading at a glance ---------- */
.call{
  margin:0 12px 22px;background:var(--surface);border:1px solid var(--rule);
  border-left:3px solid var(--chronic);border-radius:10px;overflow:hidden;
}
.call .body{padding:15px 16px 13px}
.call .eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--chronic);margin-bottom:8px;
}
.call h2{
  margin:0 0 7px;font-size:21px;line-height:1.2;font-weight:680;
  letter-spacing:-.018em;text-wrap:balance;color:var(--ink);
}
.call p{margin:0;font-size:14px;color:var(--ink-2);max-width:56ch}

/* ---------- grouped inset lists ---------- */
.ghead{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);padding:0 20px 6px;
}
.group{
  margin:0 12px;background:var(--surface);border:1px solid var(--rule);
  border-radius:10px;overflow:hidden;
}
.gfoot{
  padding:7px 20px 0;font-size:12px;color:var(--ink-3);max-width:62ch;
}
.gap{height:22px}

.row{
  display:flex;align-items:center;gap:12px;width:100%;
  min-height:var(--tap);padding:9px 14px;
  background:none;border:0;border-top:1px solid var(--rule-soft);
  color:var(--ink);font:inherit;text-align:left;
}
.row:first-child{border-top:0}
button.row{cursor:pointer;width:100%}
a.row{text-decoration:none;color:var(--ink)}
button.row:active,a.row:active{background:var(--raised)}
button.row:focus-visible,a.row:focus-visible,.back:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
a.row .val{color:var(--ok)}
.row .lab{flex:1;min-width:0}
.row .lab .t{display:block}
.row .lab .s{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.row .val{
  font-family:var(--mono);font-size:12.5px;color:var(--ink-3);
  text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;
}
/* The chevron is a contract: present means there is more underneath,
   absent means this row is everything there is. */
.row .chev{color:var(--ink-3);font-size:19px;line-height:1;flex:none;margin-left:-4px}

/* ---------- chips: state carried by label AND colour ---------- */
.chip{
  display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid transparent;
  white-space:nowrap;
}
.chip.chronic{color:var(--chronic);background:var(--chronic-bg);border-color:var(--chronic)}
.chip.returned{color:var(--accent);background:var(--accent-bg);border-color:var(--accent)}
.chip.cleared{color:var(--cleared);background:var(--cleared-bg)}
.chip.once,.chip.recurring{color:var(--once);background:var(--once-bg)}
.chip.ok{color:var(--ok);background:var(--ok-bg)}
.chip.warn{color:var(--chronic);background:var(--chronic-bg)}

/* ---------- detail bodies ---------- */
.prose{padding:14px 16px;font-size:14px;color:var(--ink-2)}
.prose>:first-child{margin-top:0}
.prose>:last-child{margin-bottom:0}
.prose p{margin:0 0 10px;max-width:62ch}
.prose b,.prose strong{color:var(--ink);font-weight:640}
.prose .lead{color:var(--ink);font-size:15px}
.kv{width:100%;border-collapse:collapse;font-size:13.5px}
.kv td{padding:8px 14px;border-top:1px solid var(--rule-soft);vertical-align:top;color:var(--ink-2)}
.kv tr:first-child td{border-top:0}
.kv td.k{color:var(--ink-3);white-space:nowrap;width:1%}
.kv td.m{font-family:var(--mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{
  text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);padding:8px 14px;
  border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--surface-2);
}
.tbl td{padding:8px 14px;border-top:1px solid var(--rule-soft);color:var(--ink-2);vertical-align:top}
.tbl td.m{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.note{
  margin:12px 16px;padding:10px 13px;border-left:3px solid var(--ink-3);
  background:var(--surface-2);border-radius:0 6px 6px 0;font-size:13.5px;color:var(--ink-2);
}
.note.warn{border-left-color:var(--chronic);background:var(--chronic-bg)}
.note.bad{border-left-color:var(--accent);background:var(--accent-bg)}
.note.good{border-left-color:var(--ok);background:var(--ok-bg)}
.note .l{
  display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:4px;
}
.src{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding:0 16px 14px}

.legend{
  margin:26px 12px 0;padding:12px 16px;border:1px dashed var(--rule);border-radius:10px;
  font-size:12px;color:var(--ink-3);
}
.legend b{color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="phone">
  <nav class="nav">
    <button class="back" id="back" hidden><span class="chev">&#8249;</span><span id="backLabel"></span></button>
    <h1 id="title">Stelvio</h1>
    <span class="vin">ZASFAKPN5J7B88115</span>
  </nav>
  <div class="vstrip">
    <span><b>140,883</b> km</span>
    <span>114,117 &rarr; 140,883 <b>(26,767 km)</b></span>
    <span><b>17</b> logs</span>
    <span>3 ECUs</span>
    <span>2025-09-24 &rarr; 2026-08-31</span>
  </div>
  <main id="main"></main>
</div>

<script>
/* Prototype navigation only. In the real app every screen below is a URL, so
   the browser's own back button, deep links and printing all work without this. */
const S = {};

const row = (r) => {
  const val = r.val ? `<span class="val">${r.val}</span>` : "";
  const chip = r.chip ? `<span class="chip ${r.chipKind||''}">${r.chip}</span>` : "";
  const sub  = r.sub ? `<span class="s">${r.sub}</span>` : "";
  const lab  = `<span class="lab"><span class="t">${r.label}</span>${sub}</span>`;
  if (!r.to) return `<div class="row">${lab}${chip}${val}</div>`;
  return `<button class="row" data-to="${r.to}">${lab}${chip}${val}<span class="chev">&#8250;</span></button>`;
};
const group = (g) => `
  ${g.head ? `<div class="ghead">${g.head}</div>` : ""}
  <div class="group">${(g.rows||[]).map(row).join("")}${g.html||""}</div>
  ${g.foot ? `<div class="gfoot">${g.foot}</div>` : ""}
  <div class="gap"></div>`;
/* Every discovery ends with sources the mechanic can open and check for himself.
   Internal analysis is cited too, but distinguished: an online link is verifiable,
   a repo path is only traceable, and a paywalled document is neither. */
const refGroup = (list) => {
  const rows = list.map(r => {
    const kindChip = r.kind === "open"    ? `<span class="chip ok">online</span>`
                   : r.kind === "paywall" ? `<span class="chip warn">paywalled</span>`
                   :                        `<span class="chip once">internal</span>`;
    const inner = `<span class="lab"><span class="t">${r.label}</span>`
                + `<span class="s">${r.note||""}</span></span>${kindChip}`;
    return r.url
      ? `<a class="row" href="${r.url}" target="_blank" rel="noopener noreferrer">${inner}<span class="val">${r.host||"open"} &#8599;</span></a>`
      : `<div class="row">${inner}<span class="val">${r.host||""}</span></div>`;
  }).join("");
  return `<div class="ghead">Verify this</div><div class="group">${rows}</div>
          <div class="gfoot">Nothing above asks you to take the tool's word for it.</div><div class="gap"></div>`;
};

const screen = (s, id) => (s.call ? s.call : "")
  + (s.groups||[]).map(group).join("")
  + (REFS[id] ? refGroup(REFS[id]) : "")
  + (s.tail||"");

/* ============================ BIBLIOGRAPHY ============================
   Only links that were actually verified during the platform research are listed.
   A source the mechanic cannot open is marked, not dressed up as one he can. */
const NHTSA_COMPLAINTS = "https://api.nhtsa.gov/complaints/complaintsByVehicle?make=alfa%20romeo&model=stelvio&modelYear=2018";
const NHTSA_RECALLS    = "https://api.nhtsa.gov/recalls/recallsByVehicle?make=alfa%20romeo&model=stelvio&modelYear=2018";
const MOPAR_PURGE      = "https://parts.moparonlineparts.com/oem-parts/alfa-romeo-duty-cycle-purge-solenoid-68337662ac";
const MES_SUPPORTED    = "https://www.multiecuscan.net/SupportedVehiclesList.aspx";

const REFS = {
  root: [
    {label:"NHTSA complaints &mdash; 2018 Stelvio", note:"371 owner narratives, full text, free and unauthenticated", url:NHTSA_COMPLAINTS, host:"api.nhtsa.gov", kind:"open"},
    {label:"NHTSA recalls &mdash; 2018 Stelvio", note:"Confirm U36, U34 and 93C against this VIN", url:NHTSA_RECALLS, host:"api.nhtsa.gov", kind:"open"},
    {label:"docs/research/EVAP_STELVIO.md", note:"Clinical ordering and platform base rates", host:"repo", kind:"internal"},
    {label:"Stellantis IOP service documents", note:"Primary FCA service info &mdash; subscription only", host:"paywall", kind:"paywall"},
  ],
  chronic: [
    {label:"NHTSA complaints &mdash; 2018 Stelvio", note:"3 EVAP mentions across 371 narratives; weak but non-zero", url:NHTSA_COMPLAINTS, host:"api.nhtsa.gov", kind:"open"},
    {label:"docs/research/EVAP_STELVIO.md", note:"Why several EVAP codes are one fault", host:"repo", kind:"internal"},
    {label:"This car's own logs", note:"FESLog_2509241345 and FESLog_2608271119 &mdash; on this machine", host:"corpus", kind:"internal"},
  ],
  purge: [
    {label:"Mopar &mdash; duty cycle purge solenoid 68337662AC", note:"Catalogue page, diagrams and fitment", url:MOPAR_PURGE, host:"moparonlineparts.com", kind:"open"},
    {label:"actuator_history for this VIN", note:"The six COMPLETED runs, from this car's logs", host:"corpus", kind:"internal"},
  ],
  parts: [
    {label:"Mopar &mdash; duty cycle purge solenoid 68337662AC", note:"The one number verified so far", url:MOPAR_PURGE, host:"moparonlineparts.com", kind:"open"},
    {label:"MES supported vehicles and coverage matrix", note:"Best free architecture document for this platform", url:MES_SUPPORTED, host:"multiecuscan.net", kind:"open"},
  ],
  p1: [
    {label:"Mopar catalogue &mdash; 68337662AC", note:"Verify supersession before ordering; suffix may have moved", url:MOPAR_PURGE, host:"moparonlineparts.com", kind:"open"},
  ],
  d1: [
    {label:"docs/research/EVAP_STELVIO.md", note:"Canister as dominant failure on this platform", host:"repo", kind:"internal"},
    {label:"NHTSA complaints &mdash; 2018 Stelvio", note:"Check for refuelling click-off reports", url:NHTSA_COMPLAINTS, host:"api.nhtsa.gov", kind:"open"},
    {label:"TSB 25-009-24 &mdash; Dual EVAP filter kit", note:"Full text not freely published", host:"paywall", kind:"paywall"},
  ],
  d2: [
    {label:"STAR S2125000002 (2021-06-18)", note:"Full text not freely published; summarised in the repo catalogue", host:"paywall", kind:"paywall"},
    {label:"docs/reference/TSB_CATALOGUE.md", note:"NHTSA-derived set, captured 2026-08-27", host:"repo", kind:"internal"},
  ],
  d3: [
    {label:"Mopar &mdash; duty cycle purge solenoid 68337662AC", note:"The part you would be ordering", url:MOPAR_PURGE, host:"moparonlineparts.com", kind:"open"},
    {label:"actuator_history for this VIN", note:"Six COMPLETED runs argue against it", host:"corpus", kind:"internal"},
  ],
  d4: [
    {label:"NHTSA recalls &mdash; 2018 Stelvio", note:"18V636000 (UA4) and 19V551000 (V84) are both software", url:NHTSA_RECALLS, host:"api.nhtsa.gov", kind:"open"},
    {label:"docs/reference/TSB_CATALOGUE.md", note:"18-030-17 REV. B fixed-DTC list", host:"repo", kind:"internal"},
  ],
  tsb: [
    {label:"NHTSA recalls &mdash; 2018 Stelvio", note:"Recalls are free to look up; TSBs are not", url:NHTSA_RECALLS, host:"api.nhtsa.gov", kind:"open"},
    {label:"docs/reference/TSB_CATALOGUE.md", note:"17 bulletins, each with its source noted", host:"repo", kind:"internal"},
  ],
  codes: [
    {label:"NHTSA complaints &mdash; 2018 Stelvio", note:"Symptom prevalence; useless for root cause", url:NHTSA_COMPLAINTS, host:"api.nhtsa.gov", kind:"open"},
    {label:"docs/research/GIORGIO_PLATFORM.md", note:"Why a -2F/-86/-87 spread is one event", host:"repo", kind:"internal"},
    {label:"MES coverage matrix", note:"Which modules sit on which bus", url:MES_SUPPORTED, host:"multiecuscan.net", kind:"open"},
  ],
  blind: [
    {label:"docs/research/MES_CAPABILITY_GAPS.md", note:"Readiness, Mode $06 and Mode $0A, and what closes each", host:"repo", kind:"internal"},
  ],
  clear: [
    {label:"docs/research/MES_CAPABILITY_GAPS.md", note:"Why a clean re-read after a clear proves nothing", host:"repo", kind:"internal"},
  ],
  e1: [
    {label:"STAR S2125000002 (2021-06-18)", note:"Full text not freely published", host:"paywall", kind:"paywall"},
    {label:"docs/reference/TSB_CATALOGUE.md", note:"Summarised, with the source recorded", host:"repo", kind:"internal"},
  ],
  t2: [
    {label:"docs/research/EVAP_STELVIO.md", note:"Why a road test cannot verify a small-leak repair", host:"repo", kind:"internal"},
  ],
};

/* ============================ ROOT: THE CALL ============================ */
S.root = {
  title: "Stelvio", back: null,
  call: `<section class="call"><div class="body">
      <div class="eyebrow">The call &middot; demonstrated</div>
      <h2>Chronic EVAP small leak &mdash; not verified by the last shop</h2>
      <p>Present across 26,455&nbsp;km. Cleared three days ago and re-read clean,
         which proves the erase worked and nothing else.</p>
    </div>
    <div class="group" style="margin:0;border:0;border-top:1px solid var(--rule);border-radius:0">
      ${row({label:"Next: E1 recirculation quick-connect", sub:"Free, two minutes, before anything is ordered", val:"free &middot; 2 min", to:"e1"})}
    </div></section>`,
  groups: [
    { head: "Why",
      rows: [
        {label:"Chronic, not fresh",        val:"P0456 &middot; 2 sessions", to:"chronic"},
        {label:"Last clear proved nothing", val:"3 days ago",                to:"clear"},
        {label:"Purge valve actuates",      val:"6 tests passed",            to:"purge"},
      ],
      foot: "Each line is the ground for the call above. Tap for the evidence behind it." },
    { rows: [
        {label:"Differential",      val:"4 candidates", to:"diff"},
        {label:"Parts",             val:"1 sourced &middot; 2 open", to:"parts"},
        {label:"Blind spots",       val:"4 open",       to:"blind"},
        {label:"Bulletins",         val:"3 apply",      to:"tsb"},
        {label:"All codes",         val:"22",           to:"codes"},
        {label:"Already attempted", val:"17 operations",to:"attempted"},
        {label:"Logs",              val:"17",           to:"logs"},
      ],
      foot: "Simulation logs excluded &mdash; 54 of 80 sessions in this install are MES practice data. SCAN provenance is reported as unverifiable, never clean." },
  ],
  tail: `<div class="legend"><b>Reading this screen.</b> A chevron means there is more underneath;
    no chevron means the row is everything there is. Nothing has been hidden &mdash;
    every panel from the current dossier is one tap down instead of a scroll past.</div>`
};

/* ============================ WHY &rarr; DETAILS ============================ */
S.chronic = {
  title: "P0456", back: "Stelvio",
  groups: [
    { html: `<div class="prose">
        <p class="lead"><b>Evaporation system leak</b> &mdash; small leak, chronic.</p>
        <p>Seen in two sessions <b>26,455&nbsp;km apart</b>. A tool that reported only
           &ldquo;last seen 2026-08-27&rdquo; would make this look like a fresh fault.</p>
      </div>
      <table class="kv">
        <tr><td class="k">Module</td><td>Magneti Marelli IAW 10JA CF6/EOBD Injection (2.0)</td></tr>
        <tr><td class="k">Sessions</td><td class="m">2</td></tr>
        <tr><td class="k">Odometer</td><td class="m">114,116.9 &rarr; 140,572.6 km <b>(26,455.7 km)</b></td></tr>
        <tr><td class="k">Statuses</td><td>stored, cleared</td></tr>
        <tr><td class="k">Assessment</td><td><b>chronic &mdash; recurs across sessions</b></td></tr>
      </table>` },
    { head: "Every occurrence",
      html: `<div class="scroll"><table class="tbl">
        <thead><tr><th>When</th><th>Status</th><th>Odometer</th><th>File</th></tr></thead>
        <tbody>
          <tr><td class="m">2025-09-24 13:45</td><td><span class="chip once">stored</span></td><td class="m">114,116.9 km</td><td class="m">FESLog_2509241345</td></tr>
          <tr><td class="m">2026-08-27 11:19</td><td><span class="chip cleared">cleared</span></td><td class="m">140,572.6 km</td><td class="m">FESLog_2608271119</td></tr>
        </tbody></table></div>` },
    { rows:[{label:"Freeze frame captured when it set", val:"28 parameters", to:"freeze"}] },
  ]
};

S.clear = {
  title: "Clear assessment", back: "Stelvio",
  groups: [
    { html: `<div class="note warn"><span class="l">Clearing is not fixing</span>
        <b>Cleared: P0440-00.</b> Codes cleared and did not return before the session
        ended. This is <b>NOT proof of repair</b>: after a clear the ECU reports nothing
        until each monitor runs again. A clean re-read minutes later mostly proves the
        erase worked.</div>
      <div class="prose"><p><b>Next.</b> Complete the relevant drive cycle, then re-scan.
        Until the monitor has run, absence of a code carries no information.</p></div>
      <table class="kv">
        <tr><td class="k">Cleared</td><td class="m">P0440-00</td></tr>
        <tr><td class="k">Returned in session</td><td class="m">none</td></tr>
        <tr><td class="k">Refused the erase</td><td class="m">none</td></tr>
        <tr><td class="k">Re-read after clear</td><td class="m">yes</td></tr>
        <tr><td class="k">Session</td><td class="m">2026-08-31 18:23</td></tr>
      </table>` },
    { head: "What would settle it",
      rows:[
        {label:"Readiness monitors", sub:"Have they run since the clear?", val:"not built", chip:"live", chipKind:"warn"},
        {label:"Permanent DTCs, Mode $0A", sub:"Standing regardless of the erase", val:"not built", chip:"live", chipKind:"warn"},
      ],
      foot:"Both need the car connected. CUORE reports <b>live_obd: false</b> today and says so rather than implying otherwise." },
  ]
};

S.purge = {
  title: "Purge valve", back: "Stelvio",
  groups: [
    { html: `<div class="note good"><span class="l">Step E3 &mdash; already answered on this car</span>
        The purge valve has already <b>COMPLETED 6 actuator tests</b> in this vehicle's own
        logs &mdash; including while P0456 was stored. The valve actuates. Weight diagnosis
        toward the vent/canister side.</div>
      <div class="src">source: actuator_history for this VIN</div>` },
    { head: "The six runs",
      html: `<div class="scroll"><table class="tbl">
        <thead><tr><th>When</th><th>Operation</th><th>Outcome</th></tr></thead>
        <tbody>

/* ============================ ROUTER ============================ */
const main=document.getElementById("main"), titleEl=document.getElementById("title"),
      backBtn=document.getElementById("back"), backLbl=document.getElementById("backLabel");
let stack=["root"];
function render(){
  const id=stack[stack.length-1];
  const s=S[id]||S.root;
  main.innerHTML=screen(s,id);
  titleEl.textContent=s.title;
  if(stack.length>1){ backBtn.hidden=false; backLbl.textContent=s.back||"Back"; }
  else backBtn.hidden=true;
  main.scrollIntoView({block:"start"});
  window.scrollTo(0,0);
}
main.addEventListener("click",e=>{
  const b=e.target.closest("button.row[data-to]"); if(!b) return;
  const to=b.getAttribute("data-to"); if(!S[to]) return;
  stack.push(to); history.pushState({d:stack.length},""); render();
});
backBtn.addEventListener("click",()=>history.back());
window.addEventListener("popstate",()=>{ if(stack.length>1) stack.pop(); render(); });
history.replaceState({d:1},"");
render();
</script>
