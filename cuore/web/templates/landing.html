{% extends "base.html" %}
{% block title %}CUORE{% endblock %}
{% block content %}
<link rel="stylesheet" href="{{ static_url('landing.css') }}">
<section class="stage" aria-labelledby="stage-h">
  <h1 id="stage-h" class="sr-only">Choose a brand</h1>
  <div class="brand-row">
    {% for b in brands %}
    <a class="brand-tile{{ ' last' if b.last }}" data-marque="{{ b.key }}" data-brand="{{ b.key }}" href="/cars?brand={{ b.key }}" aria-label="{{ b.name }}" style="--i:{{ loop.index0 }}"{% if b.last %} aria-current="true"{% endif %}>
      <span class="bt-disc">{% set b = dict(b, mark_url=b.landing_url or b.mark_url) %}{% include "_brand_mark.html" %}</span>
    </a>
    {% endfor %}
  </div>
</section>
{% endblock %}
