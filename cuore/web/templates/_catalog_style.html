{# Shared styles for the parts catalogue pages (catalog_*.html). #}
<style>
.cat-search { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
.cat-search input[type=search] { flex: 1 1 260px; min-width: 0; font-size: 16px; }
.cat-crumbs { font-size: 13px; color: var(--ink-3); margin: 0 0 8px; }
.cat-crumbs a { color: var(--ink-2); }
.cat-toc { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 12px; font-size: 13px; }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.cat-card { display: flex; flex-direction: column; gap: 4px; padding: 6px; border: 1px solid var(--rule); border-radius: var(--radius); text-decoration: none; color: var(--ink); background: var(--surface); min-width: 0; }
.cat-card:hover { border-color: var(--ink-3); }
.cat-card img { width: 100%; height: 150px; object-fit: contain; background: #fff; border-radius: 2px; }
.cat-card .t { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
.cat-card .n { font-size: 12px; color: var(--ink-3); }
.cat-sec { margin: 10px 0 16px; }
.cat-sec h3 { font-size: 14px; margin: 0 0 6px; }
.cat-diagram { background: #fff; border: 1px solid var(--rule); border-radius: var(--radius); padding: 8px; text-align: center; }
.cat-diagram img { max-width: 100%; height: auto; image-rendering: auto; }
.cat-wrap { overflow-x: auto; max-width: 100%; }
.cat-table { min-width: 560px; }
.cat-table td, .cat-table th { vertical-align: top; text-align: left; padding: 6px 8px; }
.cat-table .ref { font-family: var(--mono); width: 40px; }
.cat-table .pn { font-family: var(--mono); white-space: nowrap; }
.cat-table .sub { font-size: 12px; color: var(--ink-3); }
.cat-table tr.other-engine td { opacity: .55; }
.cat-photos { display: flex; flex-wrap: wrap; gap: 10px; }
.cat-photos figure { margin: 0; flex: 1 1 260px; max-width: 520px; background: #fff; border: 1px solid var(--rule); border-radius: var(--radius); padding: 6px; }
.cat-photos img { width: 100%; height: auto; }
.cat-photos figcaption { font-size: 12px; color: #444; }
.cat-tag { font-size: 11px; letter-spacing: .04em; padding: 1px 6px; border: 1px solid currentColor; border-radius: var(--radius); white-space: nowrap; }
.cat-mech dt { font-size: 12px; color: var(--ink-3); margin-top: 8px; }
.cat-mech dd { margin: 2px 0 0; }
.cat-mech ul { margin: 2px 0; padding-left: 18px; }
.cat-src { font-size: 11px; color: var(--ink-3); overflow-wrap: anywhere; }
.cat-pager { display: flex; justify-content: space-between; gap: 8px; margin: 8px 0; font-size: 13px; }
</style>
