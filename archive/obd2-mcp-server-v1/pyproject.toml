[project]
name = "obd2-mcp-server"
version = "0.1.0"
description = "MCP server for OBD2 vehicle diagnostics with Multiecuscan integration"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "obd>=0.7.2",
    "pyserial>=3.5",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]

[project.scripts]
obd2-mcp = "src.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
line-length = 100
target-version = "py310"
